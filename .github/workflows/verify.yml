name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify committed historical evidence
        run: npm run check:preservation
      - name: Test contracts, grading, failures, and server
        run: npm test
      - name: Rehearse a complete failed comparison without a provider
        run: npm run demo:failures
      - name: Exercise external processes and tool permissions
        run: npm run demo:external
      - name: Install pinned browser test dependencies
        run: npm ci
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Check browser navigation and local report opening
        run: npm run test:browser
      - name: Verify evidence again after execution
        if: always()
        run: npm run check:preservation
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ matrix.os }}
          path: |
            output/playwright/results/
            output/playwright/report/
          if-no-files-found: ignore
          retention-days: 7
